<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>New Tab</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #202124;
        --dim: #5f6368;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #202124;
          --text: #e8eaed;
          --dim: #9aa0a6;
        }
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 40px;
        font-weight: 400;
        letter-spacing: -0.5px;
      }
      p {
        margin: 0;
        color: var(--dim);
      }
      kbd {
        padding: 1px 5px;
        border: 1px solid currentColor;
        border-radius: 4px;
        font-family: inherit;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>chromium</h1>
    <p>Type an address or a search above — <kbd>Ctrl</kbd> <kbd>L</kbd> jumps there.</p>
  </body>
</html>
