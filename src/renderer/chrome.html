<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'" />
    <title>Browser chrome</title>
    <link rel="stylesheet" href="chrome.css" />
  </head>
  <body>
    <div class="tabstrip">
      <div class="tabs" id="tabs"></div>
      <button class="icon-button new-tab" id="new-tab" title="New tab (Ctrl+T)" aria-label="New tab">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" /></svg>
      </button>
    </div>

    <div class="toolbar">
      <button class="icon-button" id="back" title="Back (Alt+Left)" aria-label="Back">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>
      </button>
      <button class="icon-button" id="forward" title="Forward (Alt+Right)" aria-label="Forward">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" /></svg>
      </button>
      <button class="icon-button" id="reload" title="Reload (Ctrl+R)" aria-label="Reload">
        <svg viewBox="0 0 16 16" aria-hidden="true" class="reload-glyph">
          <path d="M13 8a5 5 0 1 1-1.6-3.7" />
          <path d="M13 2.5V5h-2.5" />
        </svg>
        <svg viewBox="0 0 16 16" aria-hidden="true" class="stop-glyph"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg>
      </button>
      <form class="address" id="address-form">
        <input
          id="address"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="Search or enter address"
          aria-label="Address and search bar"
        />
      </form>
    </div>

    <script src="chrome.js"></script>
  </body>
</html>
